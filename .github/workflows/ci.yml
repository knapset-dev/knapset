name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout knapset
        uses: actions/checkout@v7
        with:
          path: knapset

      - name: Checkout knapset-registry (for extension lifecycle tests)
        uses: actions/checkout@v7
        with:
          repository: knapset-dev/knapset-registry
          path: knapset-registry

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Zero Pip Dependencies (Pure Standard Library)
        working-directory: knapset
        run: |
          python -c "import sys; print('Python executable:', sys.executable, sys.version)"
          # Zero external pip packages required. 100% Python Standard Library.

      - name: Run Full Test Suite
        working-directory: knapset
        run: |
          python -m unittest discover tests

      - name: Run Knapsack Combinatorial Stress Benchmark
        working-directory: knapset
        run: |
          python -m unittest tests/test_stress_synthesis.py

      - name: Run End-to-End Extension Lifecycle Test
        working-directory: knapset
        run: |
          python -m unittest tests/test_e2e_extension_lifecycle.py

      - name: Validate CLI & Onboarding Walkthrough
        working-directory: knapset
        run: |
          python main.py --help
          python main.py --version
          python main.py template build -b 1000
          python main.py domains --inspect template
          python main.py template modes
          python main.py modules
          python main.py modules --json
          python main.py module search
          python main.py sync --status
          python main.py deals
          python main.py ledger
          python main.py mcp --list-tools
          python main.py serve --help
          python main.py fx
          python main.py watch --domain template --no-refresh --dry-run

      - name: Validate Isolated Extension Install & Wheel Build
        working-directory: knapset
        run: |
          TMP_KNAPSET_HOME="$(mktemp -d)"
          export KNAPSET_HOME="$TMP_KNAPSET_HOME"
          export KNAPSET_REGISTRY_URL="file://${{ github.workspace }}/knapset-registry/registry.json"
          python main.py module install pc
          python main.py pc build --no-ai -b 850
          python main.py module uninstall pc
          python main.py module install fishing
          python main.py fishing build -b 150
          python main.py module uninstall fishing
          rm -rf "$TMP_KNAPSET_HOME"
          python -m pip install --quiet build
          python -m build
          python -m venv /tmp/knapset-wheel-venv
          /tmp/knapset-wheel-venv/bin/pip install --quiet --no-deps dist/*.whl
          /tmp/knapset-wheel-venv/bin/ks --version
          /tmp/knapset-wheel-venv/bin/ks template build -b 1000
          rm -rf /tmp/knapset-wheel-venv dist build *.egg-info
