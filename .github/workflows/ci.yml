name: CI

on:
  push:
    branches: [ main, master, v2 ]
  pull_request:
    branches: [ main, master, v2 ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout knapset
        uses: actions/checkout@v7
        with:
          path: knapset

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Zero Pip Dependencies (Pure Standard Library)
        working-directory: knapset
        run: |
          python -c "import sys; print('Python executable:', sys.executable, sys.version)"

      - name: Run Full Test Suite
        working-directory: knapset
        run: |
          python -m unittest discover -s tests -v

      - name: Validate CLI Walkthrough & Wheel Build
        working-directory: knapset
        run: |
          python main.py --help
          python main.py --version
          python main.py tui --help
          python main.py serve --help
          python main.py mcp --list-tools
          python main.py preset list --json
          python -m pip install --quiet build
          python -m build
          python -m venv /tmp/knapset-wheel-venv
          /tmp/knapset-wheel-venv/bin/pip install --quiet --no-deps dist/*.whl
          /tmp/knapset-wheel-venv/bin/ks --version
          /tmp/knapset-wheel-venv/bin/ks mcp --list-tools
          rm -rf /tmp/knapset-wheel-venv dist build *.egg-info
