<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knapset v2 — Database Preference & Constraint Optimizer</title>
  <style>
    :root {
      --bg: #0b0f19; --panel: #111827; --panel-2: #1f2937;
      --border: #374151; --text: #f3f4f6; --muted: #9ca3af;
      --accent: #38bdf8; --green: #34d399; --red: #f87171; --warn: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.45; }
    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 1.15rem; color: var(--accent); }
    .hdr-right { display: flex; align-items: center; gap: 10px; }
    .hdr-right select { width: auto; min-width: 150px; padding: 5px 8px; font-size: 0.82rem; }
    main { max-width: 1280px; margin: 18px auto; padding: 0 18px; display: grid; grid-template-columns: 430px 1fr; gap: 18px; }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin: 8px 0 4px; }
    input, select, textarea { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-family: inherit; font-size: 0.85rem; }
    textarea { font-family: monospace; min-height: 48px; }
    .row { display: flex; gap: 6px; align-items: center; }
    button { background: var(--accent); color: #041019; font-weight: 600; border: none; border-radius: 6px; padding: 7px 11px; cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
    button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    button.small { padding: 4px 8px; font-size: 0.78rem; }
    button.danger { background: rgba(248, 113, 113, 0.15); color: var(--red); border: 1px solid rgba(248, 113, 113, 0.35); }
    .weight-row { display: grid; grid-template-columns: 1fr 28px 66px 28px 28px; gap: 5px; align-items: center; margin: 5px 0; }
    .weight-row input[type=number] { text-align: center; padding: 4px; font-family: monospace; }
    .result-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .score-pill { display: inline-block; background: rgba(52, 211, 153, 0.16); color: var(--green); border: 1px solid rgba(52, 211, 153, 0.4); border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 0.82rem; }
    .badge { display: inline-block; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; font-size: 0.74rem; color: var(--muted); margin: 2px 4px 2px 0; }
    .badge.pos { color: var(--green); border-color: rgba(52, 211, 153, 0.35); }
    .badge.neg { color: var(--red); border-color: rgba(248, 113, 113, 0.35); }
    .err { color: var(--red); margin-top: 8px; font-size: 0.83rem; }
    .banner { border: 1px solid var(--border); background: var(--panel-2); border-radius: 6px; padding: 7px 10px; font-size: 0.82rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    details { border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; margin-top: 8px; background: rgba(255,255,255,0.01); }
    summary { cursor: pointer; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    pre { font-size: 0.76rem; color: var(--muted); white-space: pre-wrap; margin-top: 6px; }
    .reg-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
  </style>
</head>
<body>
<header>
  <h1>Knapset v2 Studio</h1>
  <div class="hdr-right">
    <label style="display:flex;align-items:center;gap:5px;margin:0;cursor:pointer;font-size:0.8rem;">
      <input id="liveSolveCheck" type="checkbox" checked style="width:auto;" />
      <span>Live Sliders</span>
    </label>
    <span style="color:var(--muted);font-size:0.8rem;">Theme:</span>
    <select id="themeSelect" onchange="switchTheme()"></select>
  </div>
</header>
<main>
  <section class="card">
    <h2>Configuration</h2>
    <label>Load Installed Preset &amp; Profile</label>
    <div class="row">
      <select id="presetSelect" style="flex:2" onchange="onPresetChange()"><option value="">-- Custom / Source Path --</option></select>
      <select id="profileSelect" style="flex:1"><option value="">default</option></select>
      <button type="button" class="secondary" onclick="loadSelectedPreset()">Load</button>
    </div>

    <label>Saved Shared Prefs (<code>--prefs</code>)</label>
    <div class="row">
      <select id="prefsSelect" style="flex:1"><option value="">-- None --</option></select>
      <button type="button" class="secondary small" onclick="applySavedPref()">Apply</button>
      <button type="button" class="secondary small" onclick="saveCurrentPref()">Save</button>
      <button type="button" class="danger small" onclick="deleteSavedPref()">Del</button>
    </div>

    <label>Source File Path (.db / .csv / .json)</label>
    <div class="row" style="margin-bottom:5px">
      <select id="localFilesSelect" style="flex:1" onchange="pickLocalFile()"><option value="">-- Pick local file in working dir --</option></select>
      <button type="button" class="secondary small" onclick="refreshLocalFiles()">Scan</button>
    </div>
    <div class="row">
      <input id="sourcePath" placeholder="/path/to/data.db or items.csv" onkeydown="if(event.key==='Enter'){event.preventDefault();inspectSourcePath();}" />
      <button type="button" class="secondary" onclick="inspectSourcePath()">Inspect</button>
    </div>
    <div class="row">
      <div style="flex:1">
        <label>Table / Slot (optional)</label>
        <select id="tableSelect"><option value="">-- All / Default --</option></select>
      </div>
      <div style="flex:1">
        <label>Mode</label>
        <select id="modeSelect">
          <option value="solve">solve (multi-slot set)</option>
          <option value="basket">basket (knapsack)</option>
          <option value="rank">rank (single table)</option>
        </select>
      </div>
      <div style="width:74px">
        <label>Top N</label>
        <input id="topN" type="number" value="5" min="1" max="50" />
      </div>
    </div>
    <div class="row">
      <div style="flex:1">
        <label>Normalization</label>
        <select id="normSelect">
          <option value="robust">robust (Tukey IQR)</option>
          <option value="minmax">minmax (0..1)</option>
          <option value="rank">rank (percentile)</option>
        </select>
      </div>
      <div style="flex:1;padding-top:20px;">
        <label style="display:flex;align-items:center;gap:6px;margin:0;cursor:pointer;">
          <input id="diverseCheck" type="checkbox" style="width:auto;" />
          <span>Diverse Top-N sets</span>
        </label>
      </div>
    </div>

    <details id="refDetails">
      <summary>Reference DB Enrichment (<code>--ref</code> / Compare)</summary>
      <label>Reference Source (.db / .csv / .json)</label>
      <input id="refSource" placeholder="/path/to/benchmarks.csv" onkeydown="if(event.key==='Enter'){event.preventDefault();checkRefCompare();}" />
      <div class="row">
        <div style="flex:1">
          <label>Match Rule</label>
          <input id="refMatch" placeholder="title~model" />
        </div>
        <div style="width:92px">
          <label>Strategy</label>
          <select id="refStrategy">
            <option value="">auto</option>
            <option value="token">token</option>
            <option value="exact">exact</option>
            <option value="regex">regex</option>
            <option value="fuzzy">fuzzy</option>
          </select>
        </div>
        <div style="width:92px">
          <label>Unmatched</label>
          <select id="refUnmatched">
            <option value="drop">drop</option>
            <option value="keep">keep</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top:8px">
        <button type="button" class="secondary small" onclick="checkRefCompare()">Check Match Coverage</button>
        <span id="compareSummary" style="font-size:0.78rem;color:var(--muted)"></span>
      </div>
    </details>

    <details id="pinDetails">
      <summary>Pin &amp; Exclude Items (<code>--pin</code> / <code>--exclude</code>)</summary>
      <label>Pins (one per line: <code>slot=name</code> or <code>name</code>)</label>
      <textarea id="pinBox" placeholder="cpu=Ryzen 5"></textarea>
      <label>Excludes (one per line: <code>name</code> or <code>slot:name</code>)</label>
      <textarea id="excludeBox" placeholder="gpu:RTX 3050"></textarea>
    </details>

    <label style="display:flex;justify-content:space-between;align-items:center;">
      <span>Weights (<code>expr:+w</code>)</span>
      <span>
        <button class="secondary small" type="button" onclick="addWeightRow('', 0.5)">+ Weight</button>
        <button class="secondary small" type="button" onclick="suggestWeights()">Suggest</button>
      </span>
    </label>
    <div id="weightSliders"></div>
    <textarea id="weightsBox" placeholder="score:+0.6, price:-0.4" oninput="syncSlidersFromBox()"></textarea>

    <label>Formulas (one per line: <code>name = expr</code>)</label>
    <textarea id="formulasBox" placeholder="deal_pct = (ref.msrp - price) / ref.msrp * 100"></textarea>
    <label>Where Filters (one per line)</label>
    <textarea id="whereBox" placeholder="price <= 600"></textarea>
    <label>Limits (one per line: <code>sum(col) &lt;= max</code>)</label>
    <textarea id="limitsBox" placeholder="sum(price) <= 950"></textarea>
    <label>Cross-Slot Rules (one per line, <code>solve</code> mode)</label>
    <textarea id="rulesBox" placeholder="cpu.socket == mobo.socket"></textarea>

    <div class="row" style="margin-top:12px">
      <button type="button" style="flex:1" onclick="runSolve()">Optimize (Ctrl+Enter)</button>
      <button type="button" class="secondary" onclick="runSensitivity()">Stability</button>
      <button type="button" class="secondary" onclick="saveCurrentPreset()">Save Preset</button>
    </div>
    <div id="statusMsg" class="err" style="color:var(--muted)"></div>
  </section>

  <section class="card">
    <h2>
      <span>Results &amp; Schema Inspector</span>
      <span class="row">
        <button type="button" class="secondary small" onclick="downloadJson()">Export JSON</button>
        <button type="button" class="secondary small" onclick="downloadCsv()">Export CSV</button>
        <button type="button" class="secondary small" onclick="downloadMarkdown()">Export MD</button>
        <button type="button" class="secondary small" onclick="toggleRegistry()">Registry</button>
      </span>
    </h2>
    <div id="topBanner" class="banner" style="display:none;">
      <span id="topBannerText"></span>
      <span id="topBannerActions"></span>
    </div>
    <div id="registryPanel" style="display:none;margin-bottom:12px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);">
      <div class="row" style="margin-bottom:8px;">
        <input id="regQuery" placeholder="Search registry presets & themes..." onkeydown="if(event.key==='Enter'){event.preventDefault();searchRegistry();}" />
        <button type="button" class="small" onclick="searchRegistry()">Search</button>
        <button type="button" class="secondary small" onclick="installStarterBundle()">Install Starter Pack</button>
      </div>
      <div id="regResults" style="max-height:220px;overflow:auto;"></div>
    </div>
    <div id="sensitivityPanel" style="margin-bottom:10px;"></div>
    <div id="schemaPanel" style="margin-bottom:12px;color:var(--muted);font-size:0.82rem;"></div>
    <div id="resultsPanel"></div>
  </section>
</main>
<script>
let lastPayload = null;
let presetMap = {};
let inspectedSchema = null;
let liveTimer = null;

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function cleanPathInput(raw) {
  const s = String(raw || '').trim();
  if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) {
    return s.slice(1, -1).trim();
  }
  return s;
}
async function api(url, body) {
  try {
    const opts = body ? { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) } : {};
    const r = await fetch(url, opts);
    const text = await r.text();
    let parsed = {};
    try { parsed = text ? JSON.parse(text) : {}; } catch (_) { parsed = { error: text || `HTTP ${r.status}` }; }
    if (!r.ok && !parsed.error) parsed.error = `HTTP ${r.status} ${r.statusText}`;
    return parsed;
  } catch (err) {
    return { error: String(err && err.message ? err.message : err) };
  }
}
function setStatus(text, colorVar, actionHtml) {
  const msg = document.getElementById('statusMsg');
  msg.textContent = text;
  msg.style.color = colorVar || 'var(--muted)';
  const banner = document.getElementById('topBanner');
  const bText = document.getElementById('topBannerText');
  const bAct = document.getElementById('topBannerActions');
  if (text) {
    banner.style.display = 'flex';
    bText.textContent = text;
    bText.style.color = colorVar || 'var(--text)';
    bAct.innerHTML = actionHtml || '';
  } else {
    banner.style.display = 'none';
  }
}
function scheduleLiveSolve() {
  if (!document.getElementById('liveSolveCheck').checked) return;
  if (!cleanPathInput(document.getElementById('sourcePath').value) && !document.getElementById('presetSelect').value) return;
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => runSolve(), 160);
}

function applyThemeCss(cssVars) {
  if (!cssVars) return;
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries(cssVars)) {
    if (v) root.setProperty('--' + k, v);
  }
}
async function refreshThemes() {
  const data = await api('/api/themes');
  const sel = document.getElementById('themeSelect');
  sel.innerHTML = '';
  (data.themes || []).forEach(t => {
    const o = document.createElement('option');
    o.value = t.name;
    o.textContent = t.name + (t.active ? ' *' : '');
    if (t.active) {
      o.selected = true;
      applyThemeCss(t.css_vars);
    }
    sel.appendChild(o);
  });
}
async function switchTheme() {
  const name = document.getElementById('themeSelect').value;
  if (!name) return;
  const res = await api('/api/themes/use', { name });
  if (res.error) { setStatus(res.error, 'var(--red)'); return; }
  if (res.theme) applyThemeCss(res.theme.css_vars);
  await refreshThemes();
  setStatus(`Switched active theme to '${name}'.`, 'var(--green)');
}

async function refreshLocalFiles() {
  const data = await api('/api/files');
  const sel = document.getElementById('localFilesSelect');
  const prev = sel.value;
  sel.innerHTML = '<option value="">-- Pick local file in working dir --</option>';
  (data.files || []).forEach(f => {
    const o = document.createElement('option');
    o.value = f;
    o.textContent = f.split('/').slice(-2).join('/');
    sel.appendChild(o);
  });
  if (prev) sel.value = prev;
}
function pickLocalFile() {
  const val = document.getElementById('localFilesSelect').value;
  if (!val) return;
  document.getElementById('sourcePath').value = val;
  inspectSourcePath();
}

async function refreshPresets() {
  const data = await api('/api/presets');
  const sel = document.getElementById('presetSelect');
  const prev = sel.value;
  const list = data.presets || [];
  sel.innerHTML = list.length
    ? '<option value="">-- Custom / Source Path --</option>'
    : '<option value="">-- No presets installed (use Registry) --</option>';
  presetMap = {};
  list.forEach(p => {
    presetMap[p.name] = p;
    const o = document.createElement('option');
    o.value = p.name;
    o.textContent = `${p.name} (${p.mode}) - ${p.title}`;
    sel.appendChild(o);
  });
  if (prev && presetMap[prev]) sel.value = prev;
  onPresetChange();
}
function onPresetChange() {
  const name = document.getElementById('presetSelect').value;
  const p = presetMap[name];
  const profSel = document.getElementById('profileSelect');
  profSel.innerHTML = '';
  const profs = (p && p.profiles && p.profiles.length) ? p.profiles : ['default'];
  profs.forEach(pr => {
    const o = document.createElement('option');
    o.value = pr; o.textContent = pr;
    profSel.appendChild(o);
  });
}
async function loadSelectedPreset() {
  const name = document.getElementById('presetSelect').value;
  if (!name) {
    if (!Object.keys(presetMap).length) {
      setStatus('No presets installed yet — click Install Starter Pack or pick one from Registry.', 'var(--warn)', '<button type="button" class="small" onclick="installStarterBundle()">Install Starter Pack</button>');
      document.getElementById('registryPanel').style.display = 'block';
      searchRegistry();
    } else {
      setStatus('Select a preset from the dropdown first before clicking Load.', 'var(--warn)');
    }
    return;
  }
  // Clear source-file override so Optimize / Live Sliders operate on the loaded preset
  document.getElementById('sourcePath').value = '';
  document.getElementById('localFilesSelect').value = '';
  document.getElementById('tableSelect').innerHTML = '<option value="">-- All / Default --</option>';
  document.getElementById('refSource').value = '';
  document.getElementById('schemaPanel').innerHTML = '';
  document.getElementById('sensitivityPanel').innerHTML = '';

  const profile = document.getElementById('profileSelect').value || undefined;
  const res = await api('/api/solve', { preset: name, profile });
  renderResponse(res);
  if (res.mode) document.getElementById('modeSelect').value = res.mode;
  if (res.norm) document.getElementById('normSelect').value = res.norm;
  document.getElementById('diverseCheck').checked = Boolean(res.diverse);
  if (res.weights) {
    document.getElementById('weightsBox').value = Object.entries(res.weights).map(([k,v]) => `${k}:${v}`).join(', ');
    syncSlidersFromBox();
  } else {
    document.getElementById('weightsBox').value = '';
    syncSlidersFromBox();
  }
  document.getElementById('formulasBox').value = (res.formulas || []).join('\n');
  document.getElementById('whereBox').value = (res.where || []).join('\n');
  document.getElementById('limitsBox').value = (res.limits || []).join('\n');
  document.getElementById('rulesBox').value = (res.rules || []).join('\n');
}

async function saveCurrentPreset() {
  const name = prompt('Save current configuration as a local preset name (e.g. my_setup):');
  if (!name || !name.trim()) return;
  const splitLines = id => document.getElementById(id).value.split('\n').map(s => s.trim()).filter(Boolean);
  const src = cleanPathInput(document.getElementById('sourcePath').value);
  const tbl = document.getElementById('tableSelect').value || undefined;
  const weightsObj = {};
  parseWeightsText(document.getElementById('weightsBox').value).forEach(w => { weightsObj[w.expr] = w.val; });
  const sources = {};
  if (src) {
    const sKey = tbl || 'main';
    sources[sKey] = tbl ? { source: src, table: tbl } : { source: src };
  }
  const preset = {
    schema_version: '2.0',
    name: name.trim().toLowerCase().replace(/\s+/g, '_'),
    title: name.trim(),
    description: 'Saved from Knapset v2 Web Studio',
    mode: document.getElementById('modeSelect').value,
    norm: document.getElementById('normSelect').value,
    diverse: document.getElementById('diverseCheck').checked,
    sources,
    formulas: splitLines('formulasBox'),
    where: splitLines('whereBox'),
    limits: splitLines('limitsBox'),
    rules: splitLines('rulesBox'),
    profiles: { default: { weights: weightsObj } },
    default_profile: 'default',
  };
  const res = await api('/api/save-preset', { preset });
  if (res.error) { setStatus(res.error, 'var(--red)'); return; }
  await refreshPresets();
  if (res.name && presetMap[res.name]) document.getElementById('presetSelect').value = res.name;
  setStatus(`Saved preset '${res.name}' -> ${res.saved}`, 'var(--green)');
}

async function refreshPrefs() {
  const data = await api('/api/prefs');
  const sel = document.getElementById('prefsSelect');
  const prev = sel.value;
  sel.innerHTML = '<option value="">-- None --</option>';
  Object.entries(data.profiles || {}).forEach(([name, p]) => {
    const o = document.createElement('option');
    o.value = name;
    o.textContent = `${name} [${p.mode || 'rank'}]`;
    sel.appendChild(o);
  });
  if (prev && (data.profiles || {})[prev]) sel.value = prev;
}
async function applySavedPref() {
  const name = document.getElementById('prefsSelect').value;
  if (!name) { setStatus('Select a saved preference profile first.', 'var(--warn)'); return; }
  const data = await api('/api/prefs');
  const prof = (data.profiles || {})[name];
  if (!prof) return;
  if (prof.mode) document.getElementById('modeSelect').value = prof.mode;
  if (prof.norm) document.getElementById('normSelect').value = prof.norm;
  if (prof.diverse !== undefined) document.getElementById('diverseCheck').checked = Boolean(prof.diverse);
  if (prof.weights) {
    document.getElementById('weightsBox').value = Object.entries(prof.weights).map(([k,v]) => `${k}:${v}`).join(', ');
    syncSlidersFromBox();
  }
  document.getElementById('formulasBox').value = (prof.formulas || []).join('\n');
  document.getElementById('whereBox').value = (prof.where || []).join('\n');
  document.getElementById('limitsBox').value = (prof.limits || []).join('\n');
  document.getElementById('rulesBox').value = (prof.rules || []).join('\n');
  if (cleanPathInput(document.getElementById('sourcePath').value)) {
    await runSolve(name);
  } else {
    setStatus(`Loaded saved preference '${name}'.`, 'var(--green)');
  }
}
async function saveCurrentPref() {
  const name = prompt('Save current weights, formulas, filters, limits & rules as shared preference name:');
  if (!name || !name.trim()) return;
  const splitLines = id => document.getElementById(id).value.split('\n').map(s => s.trim()).filter(Boolean);
  const res = await api('/api/prefs/save', {
    name: name.trim(),
    mode: document.getElementById('modeSelect').value,
    norm: document.getElementById('normSelect').value,
    diverse: document.getElementById('diverseCheck').checked,
    weights: document.getElementById('weightsBox').value.trim(),
    formulas: splitLines('formulasBox'),
    where: splitLines('whereBox'),
    limits: splitLines('limitsBox'),
    rules: splitLines('rulesBox'),
  });
  if (res.error) { setStatus(res.error, 'var(--red)'); return; }
  await refreshPrefs();
  document.getElementById('prefsSelect').value = res.saved;
  setStatus(`Saved preference '${res.saved}' -> ${res.path}`, 'var(--green)');
}
async function deleteSavedPref() {
  const name = document.getElementById('prefsSelect').value;
  if (!name) { setStatus('Select a saved preference to delete.', 'var(--warn)'); return; }
  const res = await api('/api/prefs/delete', { name });
  if (res.error) { setStatus(res.error, 'var(--red)'); return; }
  await refreshPrefs();
  setStatus(`Deleted saved preference '${name}'.`, 'var(--warn)');
}

function parseWeightsText(text) {
  return text.split(',').map(s => s.trim()).filter(Boolean).map(part => {
    const idx = part.lastIndexOf(':');
    if (idx <= 0) return null;
    const expr = part.slice(0, idx).trim();
    const val = parseFloat(part.slice(idx + 1).trim());
    return Number.isFinite(val) ? { expr, val } : null;
  }).filter(Boolean);
}
function renderWeightSliders(items) {
  const wrap = document.getElementById('weightSliders');
  wrap.innerHTML = '';
  items.forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'weight-row';
    row.innerHTML = `
      <input value="${esc(it.expr)}" onchange="updateWeightRow(${idx}, this.value, null)" />
      <button type="button" class="secondary small" onclick="nudgeWeight(${idx}, -0.1)">-</button>
      <input type="number" step="0.1" value="${it.val}" onchange="updateWeightRow(${idx}, null, this.value)" />
      <button type="button" class="secondary small" onclick="nudgeWeight(${idx}, 0.1)">+</button>
      <button type="button" class="danger small" onclick="removeWeightRow(${idx})">×</button>
    `;
    wrap.appendChild(row);
  });
}
function syncBoxFromSliders(items) {
  document.getElementById('weightsBox').value = items.map(it => `${it.expr}:${it.val >= 0 ? '+' : ''}${Number(it.val.toFixed(3))}`).join(', ');
}
function syncSlidersFromBox() {
  renderWeightSliders(parseWeightsText(document.getElementById('weightsBox').value));
}
function addWeightRow(expr, val) {
  const items = parseWeightsText(document.getElementById('weightsBox').value);
  items.push({ expr: expr || 'price', val: val ?? -0.5 });
  syncBoxFromSliders(items);
  renderWeightSliders(items);
}
function updateWeightRow(idx, newExpr, newVal) {
  const items = parseWeightsText(document.getElementById('weightsBox').value);
  if (!items[idx]) return;
  if (newExpr !== null) items[idx].expr = newExpr.trim();
  if (newVal !== null) items[idx].val = parseFloat(newVal) || 0;
  syncBoxFromSliders(items);
  renderWeightSliders(items);
  scheduleLiveSolve();
}
function nudgeWeight(idx, delta) {
  const items = parseWeightsText(document.getElementById('weightsBox').value);
  if (!items[idx]) return;
  items[idx].val = Math.round((items[idx].val + delta) * 100) / 100;
  syncBoxFromSliders(items);
  renderWeightSliders(items);
  scheduleLiveSolve();
}
function removeWeightRow(idx) {
  const items = parseWeightsText(document.getElementById('weightsBox').value);
  items.splice(idx, 1);
  syncBoxFromSliders(items);
  renderWeightSliders(items);
  scheduleLiveSolve();
}
function suggestWeights() {
  if (!inspectedSchema || !(inspectedSchema.tables || []).length) {
    setStatus('Inspect a source first to suggest weights.', 'var(--warn)');
    return;
  }
  const tblName = document.getElementById('tableSelect').value;
  const tables = tblName ? inspectedSchema.tables.filter(t => t.name === tblName) : inspectedSchema.tables;
  const costRe = /(price|cost|fee|weight|mass|watt|tdp|power|latency|ms|risk|calor)/i;
  const items = [];
  tables.forEach(t => {
    const prefix = tables.length > 1 ? `${t.name}.` : '';
    (t.columns || []).forEach(c => {
      if (c.kind === 'number' && !/^(id|count)$/i.test(c.name) && items.length < 4) {
        items.push({ expr: prefix + c.name, val: costRe.test(c.name) ? -0.4 : 0.6 });
      }
    });
  });
  syncBoxFromSliders(items);
  renderWeightSliders(items);
}

async function inspectSourcePath() {
  const src = cleanPathInput(document.getElementById('sourcePath').value);
  document.getElementById('sourcePath').value = src;
  if (!src) {
    setStatus('Enter or pick a Source file path (.db / .csv / .json) before clicking Inspect.', 'var(--warn)');
    return;
  }
  setStatus('Inspecting source...', 'var(--muted)');
  const data = await api('/api/inspect', { source: src });
  if (data.error) { setStatus(data.error, 'var(--red)'); return; }
  inspectedSchema = data.schema;
  const tblSel = document.getElementById('tableSelect');
  tblSel.innerHTML = '<option value="">-- All / Default --</option>';
  (data.schema.tables || []).forEach(t => {
    const o = document.createElement('option');
    o.value = t.name; o.textContent = `${t.name} (${t.row_count} rows)`;
    tblSel.appendChild(o);
  });
  if ((data.schema.tables || []).length > 1) {
    document.getElementById('modeSelect').value = 'solve';
  } else if (document.getElementById('modeSelect').value === 'solve') {
    document.getElementById('modeSelect').value = 'rank';
  }
  const html = (data.schema.tables || []).map(t => {
    const colsHtml = (t.columns || []).map(c => {
      const rng = (c.min !== null && c.min !== undefined && c.max !== null && c.max !== undefined)
        ? ` [${c.min}..${c.max}]` : '';
      return `${esc(c.name)}<i>(${esc(c.kind)}${esc(rng)})</i>`;
    }).join(', ');
    return `<div style="margin-bottom:4px"><b>${esc(t.name)}</b> (${t.row_count} rows): ${colsHtml}</div>`;
  }).join('');
  document.getElementById('schemaPanel').innerHTML = html || '<div>(Empty schema)</div>';
  setStatus(`Inspected ${(data.schema.tables || []).length} table(s) from ${src}.`, 'var(--green)');
}

async function checkRefCompare() {
  const src = cleanPathInput(document.getElementById('sourcePath').value);
  const refSrc = cleanPathInput(document.getElementById('refSource').value);
  if (!src || !refSrc) { setStatus('Enter both Source and Reference Source first.', 'var(--warn)'); return; }
  const res = await api('/api/compare', {
    source: src,
    table: document.getElementById('tableSelect').value || undefined,
    ref_source: refSrc,
    match: document.getElementById('refMatch').value.trim() || undefined,
    strategy: document.getElementById('refStrategy').value || undefined,
    on_unmatched: document.getElementById('refUnmatched').value,
    limit: 5,
  });
  if (res.error) { setStatus(res.error, 'var(--red)'); return; }
  const m = res.match;
  const pct = (m.match_rate * 100).toFixed(1);
  document.getElementById('compareSummary').textContent = `${m.matched}/${m.total} matched (${pct}%) via ${m.left_field} (${m.strategy}) -> ${m.alias}.${m.right_field}`;
  setStatus(`Reference match coverage: ${m.matched}/${m.total} (${pct}%).`, 'var(--green)');
}

function buildSolvePayload(prefsOverride) {
  const splitLines = id => document.getElementById(id).value.split('\n').map(s => s.trim()).filter(Boolean);
  const src = cleanPathInput(document.getElementById('sourcePath').value);
  const refSrc = cleanPathInput(document.getElementById('refSource').value);
  const pins = splitLines('pinBox');
  const excludes = splitLines('excludeBox');
  return {
    preset: (!src && document.getElementById('presetSelect').value) ? document.getElementById('presetSelect').value : undefined,
    profile: (!src && document.getElementById('profileSelect').value) ? document.getElementById('profileSelect').value : undefined,
    prefs: typeof prefsOverride === 'string' ? prefsOverride : undefined,
    source: src || undefined,
    table: document.getElementById('tableSelect').value || undefined,
    mode: document.getElementById('modeSelect').value,
    norm: document.getElementById('normSelect').value,
    diverse: document.getElementById('diverseCheck').checked,
    top_n: parseInt(document.getElementById('topN').value || '5', 10),
    weights: document.getElementById('weightsBox').value.trim(),
    formulas: splitLines('formulasBox'),
    where: splitLines('whereBox'),
    limits: splitLines('limitsBox'),
    rules: splitLines('rulesBox'),
    pin: pins.length ? pins : undefined,
    exclude: excludes.length ? excludes : undefined,
    ref_source: refSrc || undefined,
    match: document.getElementById('refMatch').value.trim() || undefined,
    strategy: document.getElementById('refStrategy').value || undefined,
    on_unmatched: document.getElementById('refUnmatched').value,
  };
}

async function runSolve(prefsOverride) {
  const payload = buildSolvePayload(prefsOverride);
  if (!payload.preset && !payload.source) {
    setStatus('Pick/Load an installed preset or Inspect a Source file first.', 'var(--warn)');
    return;
  }
  const res = await api('/api/solve', payload);
  renderResponse(res);
}

async function runSensitivity() {
  const payload = buildSolvePayload();
  if (!payload.preset && !payload.source) {
    setStatus('Pick/Load an installed preset or Inspect a Source file first.', 'var(--warn)');
    return;
  }
  const res = await api('/api/sensitivity', payload);
  const box = document.getElementById('sensitivityPanel');
  if (res.error) { setStatus(res.error, 'var(--red)'); return; }
  if (!res.baseline) {
    box.innerHTML = '<div class="result-card">No feasible baseline solution for sensitivity check.</div>';
    return;
  }
  const lims = (res.limit_perturbations || []).map(lp =>
    `<span class="badge">${esc(lp.adjusted_limit)} → ${esc(lp.score ?? 'infeasible')} (${lp.score_delta != null ? (lp.score_delta >= 0 ? '+' : '') + lp.score_delta : '—'})</span>`
  ).join('');
  box.innerHTML = `<div class="result-card">
    <div class="row" style="justify-content:space-between">
      <b>Stability Check: ${esc(res.stability_pct)}%</b>
      <span class="badge pos">#1: ${esc(res.baseline.label)} (${esc(res.baseline.score)})</span>
    </div>
    ${res.closest_challenger ? `<div style="margin-top:4px;font-size:0.8rem;color:var(--warn)">Closest challenger: ${esc(res.closest_challenger)}</div>` : ''}
    ${lims ? `<div style="margin-top:6px">${lims}</div>` : ''}
  </div>`;
  setStatus(`Stability: ${res.stability_pct}% (#1: ${res.baseline.label}).`, 'var(--green)');
}

function quickExclude(label) {
  if (!label) return;
  const box = document.getElementById('excludeBox');
  const cur = box.value.trim();
  box.value = cur ? cur + '\n' + label : label;
  document.getElementById('pinDetails').open = true;
  runSolve();
}

function itemDisplayLabel(r) {
  if (r.row) return r.row.title || r.row.name || r.row.model || r.row.instance || '';
  if (r.items && r.items.length) {
    return r.items.map(it => `${(it.row && (it.row.name || it.row.title)) || 'item'}${it.count > 1 ? ' x' + it.count : ''}`).join(' + ');
  }
  if (r.slots) {
    return Object.entries(r.slots).map(([s, obj]) => `${s}:${obj.name || obj.title || obj.model || obj.id || '?'}`).join(' | ');
  }
  return '';
}

function renderResponse(res) {
  if (res.error) { setStatus(res.error, 'var(--red)'); return; }
  lastPayload = res;
  const skipped = (res.meta && res.meta.skipped_prefs_terms) ? ` (skipped missing cols: ${res.meta.skipped_prefs_terms.join(', ')})` : '';
  const diag = (res.meta && res.meta.diagnostics && res.meta.diagnostics.summary) ? ` — ${res.meta.diagnostics.summary}` : '';
  setStatus(`Solved ${(res.results || []).length} result(s) in mode=${res.mode}.${skipped}${diag}`, (res.results || []).length ? 'var(--green)' : 'var(--warn)');
  const panel = document.getElementById('resultsPanel');
  const emptyHtml = diag ? `<div class="result-card"><b>No feasible results</b><div style="margin-top:4px;color:var(--warn)">${esc(res.meta.diagnostics.summary)}</div></div>` : '<div class="result-card">No feasible results found.</div>';
  panel.innerHTML = (res.results || []).map((r, i) => {
    const score = r.score ?? r.total_score ?? 0;
    const itemLbl = itemDisplayLabel(r);
    const canQuickExclude = Boolean(r.row && itemLbl);
    const exBtn = canQuickExclude ? `<button type="button" class="danger small" data-exclude-idx="${i}">Exclude</button>` : '';
    const bdHtml = (r.breakdown || []).map(b => {
      const cls = b.weight >= 0 ? 'pos' : 'neg';
      return `<span class="badge ${cls}">${esc(b.expression)}: raw=${esc(b.raw_value)} n=${b.normalized} w=${b.weight} (+${b.contribution})</span>`;
    }).join('');
    return `<div class="result-card"><div class="row" style="justify-content:space-between"><b>#${i+1} ${esc(itemLbl)}</b><div class="row">${exBtn}<span class="score-pill">${esc(score)}</span></div></div>${bdHtml ? `<div style="margin-top:6px">${bdHtml}</div>` : ''}<pre>${esc(JSON.stringify(r, null, 2))}</pre></div>`;
  }).join('') || emptyHtml;
}

document.getElementById('resultsPanel').addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-exclude-idx]');
  if (!btn || !lastPayload || !lastPayload.results) return;
  const idx = parseInt(btn.getAttribute('data-exclude-idx'), 10);
  const resItem = lastPayload.results[idx];
  if (resItem) quickExclude(itemDisplayLabel(resItem));
});

function triggerDownload(filename, content, mimeType) {
  let url = '';
  let isBlob = false;
  try {
    const blob = new Blob([content], { type: mimeType });
    url = URL.createObjectURL(blob);
    isBlob = true;
  } catch (_) {
    url = `data:${mimeType};charset=utf-8,${encodeURIComponent(content)}`;
  }
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    a.remove();
    if (isBlob) URL.revokeObjectURL(url);
  }, 2500);
}

function flattenPayloadRows(payload) {
  const rows = [];
  (payload.results || []).forEach((r, idx) => {
    if (r.items && Array.isArray(r.items)) {
      r.items.forEach(it => {
        const flat = { solution: idx + 1, total_score: r.total_score ?? 0, qty: it.count ?? 1, item_score: it.item_score ?? 0 };
        if (it.row) Object.entries(it.row).forEach(([k, v]) => { if (typeof v !== 'object') flat[k] = v; });
        if (r.metrics) Object.entries(r.metrics).forEach(([k, v]) => { flat['metric_' + k] = v; });
        rows.push(flat);
      });
    } else if (r.slots) {
      Object.entries(r.slots).forEach(([s, obj]) => {
        const flat = { solution: idx + 1, total_score: r.total_score ?? 0, slot: s };
        Object.entries(obj || {}).forEach(([k, v]) => { if (typeof v !== 'object') flat[k] = v; });
        if (r.metrics) Object.entries(r.metrics).forEach(([k, v]) => { flat['metric_' + k] = v; });
        rows.push(flat);
      });
    } else {
      const flat = { rank: idx + 1, score: r.score ?? r.total_score ?? 0 };
      if (r.row) Object.entries(r.row).forEach(([k, v]) => { if (typeof v !== 'object') flat[k] = v; });
      rows.push(flat);
    }
  });
  return rows;
}

function downloadJson() {
  const target = lastPayload || (inspectedSchema ? { schema: inspectedSchema } : null);
  if (!target) { setStatus('Run Optimize, Load a preset, or Inspect a source first before exporting JSON.', 'var(--warn)'); return; }
  const fname = lastPayload ? 'knapset_results.json' : 'knapset_schema.json';
  triggerDownload(fname, JSON.stringify(target, null, 2), 'application/json');
  setStatus(`Exported ${fname}.`, 'var(--green)');
}
function downloadCsv() {
  if (!lastPayload || !(lastPayload.results || []).length) {
    setStatus('No results to export — run Optimize or Load a preset first.', 'var(--warn)');
    return;
  }
  const rows = flattenPayloadRows(lastPayload);
  const cols = Array.from(new Set(rows.flatMap(Object.keys)));
  const csvEsc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [cols.map(csvEsc).join(','), ...rows.map(r => cols.map(c => csvEsc(r[c])).join(','))].join('\n');
  triggerDownload('knapset_results.csv', csv, 'text/csv;charset=utf-8');
  setStatus(`Exported knapset_results.csv (${rows.length} row(s)).`, 'var(--green)');
}
function downloadMarkdown() {
  if (!lastPayload || !(lastPayload.results || []).length) {
    setStatus('No results to export — run Optimize or Load a preset first.', 'var(--warn)');
    return;
  }
  const rows = flattenPayloadRows(lastPayload);
  const cols = Array.from(new Set(rows.flatMap(Object.keys)));
  const mdEsc = v => String(v ?? '').replace(/\|/g, '\\|');
  const lines = [
    `# Knapset Results (${lastPayload.mode || 'solve'})`,
    '',
    '| ' + cols.join(' | ') + ' |',
    '| ' + cols.map(() => '---').join(' | ') + ' |',
    ...rows.map(r => '| ' + cols.map(c => mdEsc(r[c])).join(' | ') + ' |'),
  ];
  triggerDownload('knapset_results.md', lines.join('\n') + '\n', 'text/markdown;charset=utf-8');
  setStatus('Exported knapset_results.md.', 'var(--green)');
}

function toggleRegistry() {
  const el = document.getElementById('registryPanel');
  const open = el.style.display === 'none';
  el.style.display = open ? 'block' : 'none';
  if (open) searchRegistry();
}
async function searchRegistry() {
  const q = encodeURIComponent(document.getElementById('regQuery').value.trim());
  const data = await api('/api/registry?q=' + q);
  const el = document.getElementById('regResults');
  if (data.error) { el.innerHTML = `<div class="err">${esc(data.error)}</div>`; return; }
  const items = data.modules || [];
  el.innerHTML = items.map(m => `
    <div class="reg-item">
      <div><b>${esc(m.name)}</b> <span class="badge">${esc(m.type)}</span><div style="color:var(--muted);font-size:0.75rem">${esc(m.description || '')}</div></div>
      <button type="button" class="secondary small" onclick="installRegItem('${esc(m.type)}:${esc(m.name)}', '${esc(m.type)}')">Install</button>
    </div>
  `).join('') || '<div style="color:var(--muted);font-size:0.8rem">No registry items found.</div>';
}
async function installRegItem(target, itemType) {
  setStatus(`Installing ${target}...`, 'var(--muted)');
  const res = await api('/api/registry/install', { target, use: itemType === 'themes' });
  setStatus(res.message || res.error || 'Done', res.ok ? 'var(--green)' : 'var(--red)');
  await refreshPresets();
  await refreshThemes();
  await searchRegistry();
}
async function installStarterBundle() {
  await installRegItem('bundle:starter-presets', 'bundle');
  const sel = document.getElementById('presetSelect');
  if (!sel.value && sel.options.length > 1) {
    sel.value = presetMap['pc_build'] ? 'pc_build' : sel.options[1].value;
    onPresetChange();
    await loadSelectedPreset();
  }
}

window.addEventListener('error', ev => {
  setStatus(`Web UI error: ${ev.message || 'Unknown script error'}`, 'var(--red)');
});
window.addEventListener('unhandledrejection', ev => {
  setStatus(`Web UI async error: ${(ev.reason && ev.reason.message) || ev.reason || 'Request failed'}`, 'var(--red)');
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runSolve();
  }
});

refreshThemes();
refreshPresets();
refreshPrefs();
refreshLocalFiles();
</script>
