[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knapset"
version = "2.0.0"
description = "Zero-dependency database preference, formula, and constraint optimizer (SQLite, CSV, JSON, TUI, Web, MCP)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "knapset-dev", email = "knapset-dev@users.noreply.github.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/knapset-dev/knapset"
Repository = "https://github.com/knapset-dev/knapset"
Issues = "https://github.com/knapset-dev/knapset/issues"
Releases = "https://github.com/knapset-dev/knapset/releases"

[project.scripts]
knapset = "main:main"
ks = "main:main"

[tool.setuptools]
py-modules = [
    "app_paths",
    "enricher",
    "formula_engine",
    "main",
    "mcp_server",
    "preset_loader",
    "solver_engine",
    "theme_config",
    "v2_cli",
    "web_server",
]

[tool.setuptools.packages.find]
include = [
    "sources*",
    "marketplace*",
    "tui*",
    "web_assets*",
]

[tool.setuptools.package-data]
"*" = ["*.json", "*.html", "docs/*.md"]
