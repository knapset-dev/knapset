[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knapset"
version = "1.0.2"
description = "Dependency-free Python framework for analyzing marketplace listings and optimizing compatible, budget-constrained sets."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "knapset-dev", email = "knapset-dev@users.noreply.github.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/knapset-dev/knapset"
Repository = "https://github.com/knapset-dev/knapset"
Issues = "https://github.com/knapset-dev/knapset/issues"
Releases = "https://github.com/knapset-dev/knapset/releases"

[project.scripts]
knapset = "main:main"
ks = "main:main"

[tool.setuptools]
py-modules = [
    "app_paths",
    "enricher",
    "formula_engine",
    "main",
    "preset_loader",
    "solver_engine",
    "v2_cli",
    "currency",
    "analyzer_core",
    "audit_ledger",
    "ai_inspector",
    "domain_layout",
    "domain_weights",
    "set_synthesizer",
    "extension_registry",
    "market_client",
    "market_store",
    "mcp_server",
    "provider_template",
    "scam_utils",
    "web_server",
    "watchdog",
]

[tool.setuptools.packages.find]
include = [
    "sources*",
    "configs*",
    "extensions*",
    "marketplace*",
    "component_analyser*",
    "scam_analyser*",
    "build_composer*",
    "info_providers*",
    "ai_providers*",
]

[tool.setuptools.package-data]
"*" = ["*.json", "configs/*.json", "configs/blueprints/*.json", "data/*.json", "docs/*.md"]
