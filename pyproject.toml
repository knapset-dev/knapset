[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniforge"
version = "1.0.0"
description = "Zero-dependency framework for market intelligence, defect detection, and combinatorial set optimization."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "omniforge-dev", email = "omniforge-dev@users.noreply.github.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
omniforge = "main:main"
omni = "main:main"
marketforge = "main:main"
mf = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "currency",
    "analyzer_core",
    "audit_ledger",
    "ai_inspector",
    "domain_layout",
    "domain_weights",
    "set_synthesizer",
    "extension_registry",
    "market_client",
    "market_store",
    "mcp_server",
    "provider_template",
    "scam_utils",
    "web_server",
    "watchdog",
]

[tool.setuptools.packages.find]
include = [
    "extensions*",
    "marketplace*",
    "component_analyser*",
    "scam_analyser*",
    "build_composer*",
    "info_providers*",
    "ai_providers*",
]

[tool.setuptools.package-data]
"*" = ["configs/*.json", "configs/blueprints/*.json", "data/*.json", "docs/*.md"]
